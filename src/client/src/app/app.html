<div style="font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">

  <!-- LOGIN VIEW -->
  <div *ngIf="!authService.isLoggedIn()">
    <h2>Login</h2>
    <p style="background: #f0f0f0; padding: 10px; border-radius: 4px; font-size: 0.9em;">
      Use the demo account credentials listed below to test:<br>
      <strong>Username:</strong> demo | <strong>Password:</strong> demo
    </p>
    <div style="margin-bottom: 10px;">
      <input type="text" [(ngModel)]="username" placeholder="Username" style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 10px;">
      <input type="password" [(ngModel)]="password" placeholder="Password" style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    <button (click)="onLogin()" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Log In
    </button>
    <p *ngIf="errorMessage" style="color: red; font-size: 0.9em;">{{errorMessage}}</p>
  </div>

  <!-- TODO VIEW -->
  <div *ngIf="authService.isLoggedIn()">
    <h2>My ToDo List</h2>

    <div style="display: flex; margin-bottom: 20px;">
      <input type="text" [(ngModel)]="newTodoTitle" placeholder="Add a new task..." style="flex: 1; padding: 8px;">
      <button (click)="addTodo()" style="padding: 8px 15px; background: #28a745; color: white; border: none; cursor: pointer;">Add</button>
    </div>

    <ul style="list-style: none; padding: 0;">
      <li *ngFor="let todo of todos" style="padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center;">
        <input type="checkbox" [checked]="todo.isCompleted" disabled style="margin-right: 10px;">
        <span [style.textDecoration]="todo.isCompleted ? 'line-through' : 'none'">{{ todo.title }}</span>
      </li>
    </ul>
  </div>

</div>
